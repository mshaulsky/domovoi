# domovoi configuration. Secrets are never written here: ${NAME} is resolved
# from $CREDENTIALS_DIRECTORY/NAME (systemd LoadCredential=), then
# /run/secrets/NAME (Docker Compose), then the environment variable NAME.

timezone: Europe/Moscow # IANA name; defaults to the system zone
language: ru            # en or ru; a display may override it

sources:
  - kind: tuya
    # name: tuya        # defaults to the kind; prefixes every device ID, never rename
    interval: 60s
    # stale_after: 5m   # defaults to 3× interval, at least 5 min
    access_id: ${TUYA_ACCESS_ID}
    access_key: ${TUYA_ACCESS_KEY}
    region: eu          # eu, us, cn, in
  - kind: aqara
    interval: 90s
    username: ${AQARA_USERNAME}         # the account the source signs in with; keys from the login page expire
    password_md5: ${AQARA_PASSWORD_MD5} # printf %s "$password" | md5sum — the service only ever sees the MD5
    region: RU                          # the account's region: EU, RU (incl. Kazakhstan), US, CN, KR or SG
    # api_key: ${AQARA_MCP_KEY}         # a key from agent.aqara.com/login instead of, or until it expires before, signing in
    # Runs of app automations as device events: polling misses a quick unlock. Matched by a part of
    # the automation's name, which the app spells from the trigger (IDs change with every key).
    # automations:
    #   - {match: КОГДА Разблокировать, device: aqara:doorlock-3b7f29e4, event: unlocked}
    #   - {match: КОГДА Заблокировать, device: aqara:doorlock-3b7f29e4, event: locked}
  - kind: weather       # Open-Meteo, no key; one device "weather:home" for the outside tile
    interval: 20m
    latitude: 43.24
    longitude: 76.93

storage:
  path: domovoi.db      # relative to the working directory: /var/lib/domovoi under systemd
  # retention: 2160h    # 90 days of readings and events
  # heartbeat: 1h       # an unchanged series still gets a row this often

# Short names for the hallway strip, by device ID; a device without one
# shows its name from the cloud.
# labels:
#   aqara:doorlock-3b7f29e4: замок
#   tuya:<device id>: аквариум

displays:
  - kind: pngfile
    name: preview
    path: ./frame.png   # relative to the working directory: /var/lib/domovoi under systemd
    # width: 800
    # height: 480
    # mono: false
    scenes: [overview]
    tick: 1m            # render cadence, aligned to the wall clock
    full_every: 1h      # a colour refresh at least this often, even of an unchanged frame
    # min_full_interval: 3m  # never two colour refreshes closer than this (urgent alerts excepted)
    # max_partials: 60       # monochrome partial updates allowed between two colour refreshes
    # fast: true             # colour refreshes use the fast waveform outside quiet hours
    # quiet:                 # the night; from equal to to switches it off
    #   from: "22:00"        # local wall clock, may cross midnight
    #   to: "08:00"
    #   tick: 5m             # render cadence inside the quiet hours; no fast refreshes there
    #   wash: "04:00"        # once a night: a clear cycle and a full refresh against ghosting
    # language: en
  # The panel on the Pi: Waveshare 7.5" (B) V2 on the e-Paper Driver HAT.
  # Every key below shows its default; the refresh keys above apply too.
  # - kind: epd7in5b
  #   name: panel
  #   spi: SPI0.0          # periph SPI port; /dev/spidev0.0 works too
  #   pins:                # periph GPIO names (BCM)
  #     rst: GPIO17
  #     dc: GPIO25
  #     busy: GPIO24
  #     power: GPIO18      # none: the board has no power-enable line
  #   rotation: 0          # 0 or 180: the controller turns the image itself
  #   border: white        # white, black or red: the ring outside the 800×480 area
  #   timeout: 90s         # one frame, power-up to sleep
  #   scenes: [overview]
